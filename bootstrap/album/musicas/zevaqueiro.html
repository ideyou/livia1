<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zé Vaqueiro</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap"
    rel="stylesheet">

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{
      background: #121212;
      color: white;
      font-family: 'Inter', sans-serif;
    }

    /* HERO */
    .hero{
      position: relative;

      height: 420px;

      background:
      linear-gradient(
        to top,
        #121212 0%,
        rgba(18,18,18,.6) 60%,
        rgba(0,0,0,.4) 100%
      ),
      url('../images/zevaqueiro.jpeg');

      background-size: cover;
      background-position: center 20%;
      background-repeat: no-repeat;

      display: flex;
      align-items: flex-end;

      padding: 40px;
    }

    /* BOTÃO VOLTAR */
    .btn-topo{
      position: absolute;

      top: 25px;
      left: 25px;

      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: rgba(0,0,0,.45);

      backdrop-filter: blur(6px);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      text-decoration: none;

      font-size: 1rem;

      transition: .2s;

      z-index: 10;
    }

    .btn-topo:hover{
      background: rgba(0,0,0,.7);

      transform: scale(1.05);

      color: white;
    }

    .playlist{
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      color: white;
      margin-bottom: 10px;
    }

    .hero h1{
      font-size:  clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 10px;
    }

    .ouvintes{
      color: #b3b3b3;
      font-size: 1rem;

      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 8px;
    }

    .descricao{
      color: #b3b3b3;
      font-size: 1rem;
    }

    /* CONTEÚDO */
    .conteudo{
      padding: 30px 40px;

      background:
      linear-gradient(
        to bottom,
        rgba(255,255,255,.03) 0%,
        #121212 220px
      );
    }

    /* PLAY */
    .play{
      width: 56px;
      height: 56px;

      border-radius: 50%;
      border: none;

      background: #1ed760;
      color: black;

      font-size: 1.8rem;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition: .2s;

      box-shadow: 0 8px 20px rgba(0,0,0,.35);
    }

    .play:hover{
      transform: scale(1.05);
      background: #1fdf64;
    }

    /* TÍTULO */
    .titulo{
      margin-top: 35px;
      margin-bottom: 20px;

      font-size: 1.5rem;
      font-weight: 700;

      letter-spacing: -.5px;
    }

    /* MÚSICAS */
    .musica{
      display: flex;
      align-items: center;
      gap: 16px;

      padding: 12px 16px;

      border-radius: 6px;

      text-decoration: none;
      color: white;

      transition: background .2s ease;

      margin-bottom: 4px;
    }

    .musica:hover{
      background: rgba(255,255,255,.08);
      color: white;
    }

    .numero{
      width: 30px;
      color: #b3b3b3;

      flex-shrink: 0;
    }

    .info{
      flex: 1;
      min-width: 0;
    }

    .nome{
      font-size: 1rem;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .views{
      width: 190px;

      color: #b3b3b3;
      font-size: .88rem;

      white-space: nowrap;

      flex-shrink: 0;
    }

    .tempo{
      width: 50px;

      color: #b3b3b3;
      font-size: .9rem;

      text-align: right;

      white-space: nowrap;

      flex-shrink: 0;
    }

    /* RESPONSIVO */
    @media(max-width: 768px){

      .hero{
        height: 320px;
        padding: 25px;
      }

      .hero h1{
        font-size: 3rem;
      }

      .conteudo{
        padding: 20px;
      }

      .views{
        display: none;
      }

      .nome{
        font-size: .95rem;
      }

      .btn-topo{
        top: 18px;
        left: 18px;
      }

    }

  </style>

</head>

<body>

  <!-- HERO -->
  <section class="hero">

    <!-- VOLTAR -->
    <a href="../index.html" class="btn-topo">
      <i class="bi bi-arrow-left"></i>
    </a>

    <div>

      <p class="playlist">
        Playlist Oficial
      </p>

      <h1>
        Zé Vaqueiro
      </h1>

      <div class="ouvintes">
        <i class="bi bi-headset"></i>
        5.892.415 ouvintes mensais
      </div>

      <p class="descricao">
        Os maiores hits do vaqueiro
      </p>

    </div>

  </section>

  <!-- CONTEÚDO -->
  <section class="conteudo">

    <!-- PLAY -->
    <a href="https://open.spotify.com/search/ze%20vaqueiro"
      target="_blank"
      style="text-decoration: none;">

      <button class="play">
        <i class="bi bi-play-fill"></i>
      </button>

    </a>

    <!-- TÍTULO -->
    <div class="titulo">
      Populares
    </div>

    <!-- MÚSICA 1 -->
<a href="https://open.spotify.com/search/leticia%20ze%20vaqueiro"
  target="_blank"
  class="musica">

  <div class="numero">1</div>

  <div class="info">
    <div class="nome">
      Letícia
    </div>
  </div>

  <div class="views">
    189.410.230 reproduções
  </div>

  <div class="tempo">
    3:37
  </div>

</a>

<!-- MÚSICA 2 -->
<a href="https://open.spotify.com/search/tenho%20medo%20ze%20vaqueiro"
  target="_blank"
  class="musica">

  <div class="numero">2</div>

  <div class="info">
    <div class="nome">
      Tenho Medo
    </div>
  </div>

  <div class="views">
    164.854.195 reproduções
  </div>

  <div class="tempo">
    3:10
  </div>

</a>

<!-- MÚSICA 3 -->
<a href="https://open.spotify.com/search/volta%20comigo%20bb%20ze%20vaqueiro"
  target="_blank"
  class="musica">

  <div class="numero">3</div>

  <div class="info">
    <div class="nome">
      Volta Comigo BB
    </div>
  </div>

  <div class="views">
    142.320.114 reproduções
  </div>

  <div class="tempo">
    2:42
  </div>

</a>

<!-- MÚSICA 4 -->
<a href="https://open.spotify.com/search/cangote%20ze%20vaqueiro"
  target="_blank"
  class="musica">

  <div class="numero">4</div>

  <div class="info">
    <div class="nome">
      Cangote
    </div>
  </div>

  <div class="views">
    98.642.890 reproduções
  </div>

  <div class="tempo">
    2:48
  </div>

</a>

  </section>

</body>

</html>
