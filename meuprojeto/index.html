<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Meu Linktree</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container text-center">
    <img src="livia.avif" alt="Foto" class="avatar">
    <h1 class="title">Livia Oliveira</h1>
    <p class="subtitle">Descubra romance, ação e terror no mundo dos doramas coreanos ✨</p>
    <div class="links">
      <a href="https://www.netflix.com/title/81365087" target="_blank" class="btn btn-primary">
        ⚔️ Vincenzo
      </a>

      <a href="https://www.netflix.com/title/81159258" target="_blank" class="btn btn-secondary">
        💖 Crash Landing on You
      </a>

      <a href="https://www.netflix.com/title/81061734" target="_blank" class="btn btn-dark">
        👻 Sweet Home
      </a>
    </div>
    <button class="btn btn-outline" onclick="toggleTheme()">
      Alternar Tema
    </button>
  </div>
  <script src="script.js"></script>
</body>

</html>
